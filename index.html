<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DAW 4 Hoon-jay</title>
<style>
  :root { --bg:#14161a; --panel:#1d2026; --panel2:#24272e; --line:#2c3038; --text:#e8e9ec; --dim:#8a8f99; --accent:#e9a23b; --ink:#14161a; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.4 system-ui, -apple-system, "Noto Sans KR", sans-serif; display:flex; flex-direction:column; height:100dvh; overflow:hidden; }
  button { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:10px; height:44px; min-width:44px; padding:0 12px; font:inherit; display:inline-flex; align-items:center; justify-content:center; gap:6px; }
  button:active { background:var(--panel2); }
  button:disabled { opacity:.35; }
  button.on { color:var(--accent); border-color:var(--accent); }
  .ic { display:inline-block; width:20px; height:20px; flex:none; background:currentColor; -webkit-mask:center/contain no-repeat; mask:center/contain no-repeat; }
  .ic-adjustments-horizontal { -webkit-mask-image:url(icons/adjustments-horizontal.svg); mask-image:url(icons/adjustments-horizontal.svg); }
  .ic-arrow-back-up { -webkit-mask-image:url(icons/arrow-back-up.svg); mask-image:url(icons/arrow-back-up.svg); }
  .ic-arrow-forward-up { -webkit-mask-image:url(icons/arrow-forward-up.svg); mask-image:url(icons/arrow-forward-up.svg); }
  .ic-arrows-move-horizontal { -webkit-mask-image:url(icons/arrows-move-horizontal.svg); mask-image:url(icons/arrows-move-horizontal.svg); }
  .ic-chevron-down { -webkit-mask-image:url(icons/chevron-down.svg); mask-image:url(icons/chevron-down.svg); }
  .ic-chevron-up { -webkit-mask-image:url(icons/chevron-up.svg); mask-image:url(icons/chevron-up.svg); }
  .ic-ease-in-out { -webkit-mask-image:url(icons/ease-in-out.svg); mask-image:url(icons/ease-in-out.svg); }
  .ic-file-export { -webkit-mask-image:url(icons/file-export.svg); mask-image:url(icons/file-export.svg); }
  .ic-folder-open { -webkit-mask-image:url(icons/folder-open.svg); mask-image:url(icons/folder-open.svg); }
  .ic-player-pause { -webkit-mask-image:url(icons/player-pause.svg); mask-image:url(icons/player-pause.svg); }
  .ic-player-play { -webkit-mask-image:url(icons/player-play.svg); mask-image:url(icons/player-play.svg); }
  .ic-player-skip-back { -webkit-mask-image:url(icons/player-skip-back.svg); mask-image:url(icons/player-skip-back.svg); }
  .ic-repeat { -webkit-mask-image:url(icons/repeat.svg); mask-image:url(icons/repeat.svg); }
  .ic-scissors { -webkit-mask-image:url(icons/scissors.svg); mask-image:url(icons/scissors.svg); }
  .ic-trash { -webkit-mask-image:url(icons/trash.svg); mask-image:url(icons/trash.svg); }
  .ic-wave-sine { -webkit-mask-image:url(icons/wave-sine.svg); mask-image:url(icons/wave-sine.svg); }
  .ic-zoom-in { -webkit-mask-image:url(icons/zoom-in.svg); mask-image:url(icons/zoom-in.svg); }
  .ic-device-floppy { -webkit-mask-image:url(icons/device-floppy.svg); mask-image:url(icons/device-floppy.svg); }
  .ic-x { -webkit-mask-image:url(icons/x.svg); mask-image:url(icons/x.svg); }
  .ic-link { -webkit-mask-image:url(icons/link.svg); mask-image:url(icons/link.svg); }
  .ic-plus { -webkit-mask-image:url(icons/plus.svg); mask-image:url(icons/plus.svg); }
  .ic-copy { -webkit-mask-image:url(icons/copy.svg); mask-image:url(icons/copy.svg); }
  .ic-clipboard { -webkit-mask-image:url(icons/clipboard.svg); mask-image:url(icons/clipboard.svg); }
  .ic-cut { -webkit-mask-image:url(icons/cut.svg); mask-image:url(icons/cut.svg); }
  .ic-zoom-out { -webkit-mask-image:url(icons/zoom-out.svg); mask-image:url(icons/zoom-out.svg); }

  header { display:flex; align-items:center; gap:10px; padding:10px 12px 6px; }
  header .ttl { flex:1; min-width:0; }
  header h1 { margin:0; font-size:17px; font-weight:700; }
  header h1 span { color:var(--accent); }
  header .sub { color:var(--dim); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .tab { display:none; flex:1; min-height:0; flex-direction:column; }
  .tab.show { display:flex; }
  .tools { display:flex; gap:8px; padding:4px 12px 8px; }
  .tools .sp { flex:1; }

  #view { flex:1; min-height:0; overflow:auto; overscroll-behavior:contain; }
  #content { position:relative; min-height:100%; padding-bottom:12px; }
  .stick { position:sticky; left:0; }
  #rulerBox { position:sticky; top:0; left:0; z-index:3; background:var(--bg); padding:0 21px 6px; }
  #ruler { display:block; width:100%; height:30px; touch-action:pan-y; }
  .track { margin:0 12px 8px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:6px 8px 8px; }
  .track .head { display:flex; align-items:center; gap:6px; }
  .track .dot { width:8px; height:8px; border-radius:4px; flex:none; }
  .track .name { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:14px; }
  .track .head button { height:32px; min-width:36px; padding:0; border-radius:8px; font-size:13px; font-weight:600; }
  .track .head button.on.s { background:var(--accent); color:var(--ink); }
  .lane { display:block; width:100%; height:52px; margin-top:6px; border-radius:6px; touch-action:pan-x pan-y; }
  .lane.moving { touch-action:none; }
  .trow.drop .track { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset; }
  .trow.cur .track .name { color:var(--accent); }
  .empty { margin:40px 16px; text-align:center; color:var(--dim); }

  #panel { border-top:1px solid var(--line); background:var(--panel); padding:8px 12px 10px; }
  #panel[hidden] { display:none; }
  #panel .ph { display:flex; align-items:center; gap:8px; }
  #panel .ph b { flex:1; font-size:15px; }
  #panel .ph button { height:36px; min-width:36px; padding:0; border:none; background:none; }
  #panel.fold .body { display:none; }
  .acts { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:8px 0 4px; }
  .acts button { height:52px; flex-direction:column; gap:2px; font-size:12px; }
  .row { display:flex; align-items:center; gap:10px; min-height:44px; }
  .row label { width:88px; flex:none; font-size:14px; color:var(--text); }
  .row input[type=range] { flex:1; accent-color:var(--accent); height:32px; }
  .row .val { width:74px; flex:none; text-align:right; font-variant-numeric:tabular-nums; color:var(--dim); font-size:14px; padding:6px 0; }
  .row .val input { width:70px; background:var(--bg); color:var(--text); border:1px solid var(--accent); border-radius:6px; font:inherit; text-align:right; padding:4px 6px; }
  .row .grow { flex:1; }
  .sw { width:52px; height:30px; border-radius:15px; background:var(--line); position:relative; border:none; padding:0; min-width:0; }
  .sw::after { content:""; position:absolute; top:3px; left:3px; width:24px; height:24px; border-radius:12px; background:var(--dim); transition:left .15s; }
  .sw.on { background:var(--accent); }
  .sw.on::after { left:25px; background:var(--ink); }

  #transport { background:var(--bg); padding:0 12px 8px; }
  #seekRow { display:flex; align-items:center; gap:8px; height:30px; margin-top:-1px; }
  #seekRow span { font-size:12px; font-variant-numeric:tabular-nums; color:var(--dim); min-width:44px; }
  #tCur { color:var(--text) !important; font-weight:600; }
  #tDur { text-align:right; }
  #seek { flex:1; height:30px; position:relative; touch-action:none; cursor:pointer; }
  #seekLine { position:absolute; left:0; right:0; top:13px; height:4px; border-radius:2px; background:var(--line); overflow:hidden; }
  #seekFill { height:100%; width:0; background:var(--accent); }
  #seekKnob { position:absolute; top:8px; width:14px; height:14px; margin-left:-7px; border-radius:7px; background:var(--accent); left:0; }
  #tRow { display:flex; align-items:center; gap:8px; }
  #play { width:56px; height:56px; border-radius:28px; background:var(--accent); color:var(--ink); border:none; flex:none; }
  #play .ic { width:26px; height:26px; }
  #compare { flex:1; display:flex; min-width:0; }
  #compare .seg button { height:40px; }

  nav { display:grid; grid-template-columns:repeat(3,1fr); border-top:1px solid var(--line); background:var(--panel); padding-bottom:env(safe-area-inset-bottom); }
  nav button { height:58px; border:none; border-radius:0; background:none; flex-direction:column; gap:2px; font-size:12px; color:var(--dim); }
  nav button.on { color:var(--accent); }

  .seg { display:flex; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:3px; gap:3px; flex:1; }
  .seg button { flex:1; height:38px; border:none; border-radius:8px; background:none; color:var(--dim); font-size:14px; padding:0 6px; min-width:0; }
  .seg button.on { background:var(--accent); color:var(--ink); font-weight:600; }
  .mixtop { padding-bottom:6px; }
  #mixBody { flex:1; min-height:0; overflow-y:auto; padding:0 12px 12px; overscroll-behavior:contain; }
  .chips { display:flex; gap:6px; overflow-x:auto; padding:2px 0 8px; scrollbar-width:none; }
  .chip { height:36px; border-radius:18px; padding:0 12px; font-size:13px; white-space:nowrap; flex:none; }
  .chip .dot { width:8px; height:8px; border-radius:4px; display:inline-block; }
  .chip.on { border-color:var(--accent); color:var(--accent); }
  .autorow { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:4px 0 10px; }
  .autorow > button { flex:none; }
  .autorow .auto { border-color:var(--accent); color:var(--accent); }
  .spread { display:flex; align-items:center; gap:10px; margin:-2px 0 10px; }
  .spread > span { color:var(--dim); font-size:13px; flex:none; }
  .spread .seg button { height:34px; font-size:13px; }
  .meter { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px 12px; display:grid; grid-template-columns:repeat(3,1fr); gap:4px 8px; margin-bottom:10px; }
  .meter .mv span { display:block; color:var(--dim); font-size:12px; }
  .meter .mv b { font-size:17px; font-variant-numeric:tabular-nums; }
  .meter canvas { grid-column:1 / -1; width:100%; height:40px; margin-top:6px; }
  .sec { background:var(--panel); border:1px solid var(--line); border-radius:12px; margin-bottom:8px; }
  .sec-h { display:flex; align-items:center; gap:8px; min-height:48px; padding:0 10px 0 12px; cursor:pointer; }
  .sec-h b { flex:1; font-size:15px; font-weight:600; }
  .sec-h .ic { transform:rotate(-90deg); transition:transform .15s; color:var(--dim); }
  .sec.open .sec-h .ic { transform:none; }
  .sec-b { display:none; padding:0 12px 10px; }
  .sec.open .sec-b { display:block; }
  .curve { display:block; width:100%; height:110px; background:#181a1f; border-radius:8px; margin-bottom:4px; }
  .note { color:var(--dim); font-size:12px; margin:4px 0 2px; }
  .row small { display:block; color:var(--dim); font-size:12px; }

  #expBody { flex:1; min-height:0; overflow-y:auto; padding:6px 12px 12px; overscroll-behavior:contain; }
  #expFoot { display:flex; align-items:center; gap:10px; padding:8px 12px; border-top:1px solid var(--line); background:var(--panel); }
  #expFoot[hidden] { display:none; }
  .xsum { flex:1; color:var(--dim); font-size:13px; }
  .xgo { background:var(--accent); color:var(--ink); border:none; font-weight:700; min-width:150px; height:48px; }
  .xwave { display:block; width:100%; height:96px; border-radius:8px; touch-action:none; }
  .xcard { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:10px; display:flex; flex-direction:column; gap:8px; }
  .xh { font-size:15px; }
  .xrow { justify-content:flex-start; gap:8px; height:48px; background:var(--bg); }
  .xrow span:first-child { flex:1; text-align:left; }
  .xv { color:var(--dim); font-size:14px; }
  .xtrack .dot { width:8px; height:8px; border-radius:4px; flex:none; }
  .xsub { display:flex; align-items:center; gap:10px; }
  .xinfo { display:flex; gap:10px; }
  .xart { width:104px; height:104px; flex:none; flex-direction:column; border-style:dashed; padding:0; overflow:hidden; font-size:12px; color:var(--dim); background:var(--bg); }
  .xart .plus { font-size:28px; line-height:1; }
  .xart img { width:100%; height:100%; object-fit:cover; display:block; }
  .xfields { flex:1; min-width:0; display:flex; flex-direction:column; gap:6px; }
  .xfield span, .xlabel { display:block; color:var(--dim); font-size:12px; margin-bottom:3px; }
  .xfield input, #expBody textarea { width:100%; background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:8px; font:inherit; padding:9px 10px; }
  #expBody textarea { min-height:110px; resize:vertical; }
  .xcount { text-align:right; color:var(--dim); font-size:12px; }
  .xbtns { display:flex; flex-wrap:wrap; gap:6px; }
  .xbtns button { height:36px; font-size:13px; padding:0 10px; }
  .xlink { align-self:flex-start; height:32px; font-size:13px; color:var(--dim); }

  header button { padding:0 10px; }
  #relinkBar { display:flex; align-items:center; gap:8px; margin:0 12px 8px; padding:8px 10px; border:1px dashed var(--accent); border-radius:10px; color:var(--accent); font-size:13px; }
  #relinkBar[hidden] { display:none; }
  #relinkBar span { flex:1; }
  #relinkBar button { height:38px; color:var(--accent); border-color:var(--accent); }
  .track.miss { border-style:dashed; opacity:.75; }
  .track.miss .mbody { display:flex; align-items:center; justify-content:space-between; height:52px; margin-top:6px; padding:0 10px; border-radius:6px; background:#181a1f; color:var(--dim); font-size:13px; }
  .track.miss .mbody button { height:36px; font-size:13px; }
  #sheet { position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:20; display:flex; align-items:flex-end; }
  #sheet[hidden] { display:none; }
  .sheet-box { width:100%; max-height:85dvh; overflow-y:auto; background:var(--bg); border-radius:16px 16px 0 0; padding:8px 12px calc(12px + env(safe-area-inset-bottom)); }
  .sheet-h { display:flex; align-items:center; justify-content:space-between; padding:4px 2px 8px; }
  .sheet-h b { font-size:17px; }
  .sheet-h button { border:none; background:none; }
  .pitem { border-top:1px solid var(--line); padding:8px 0; display:flex; flex-direction:column; gap:6px; }
  .pitem.on b { color:var(--accent); }
  .pname small { display:block; color:var(--dim); font-size:12px; }
  .soon { margin:auto; color:var(--dim); text-align:center; padding:24px; }
</style>
</head>
<body>
<header>
  <div class="ttl"><h1>DAW <span>4</span> Hoon-jay</h1><div class="sub" id="sub">음원을 불러오세요</div></div>
  <button id="proj"><i class="ic ic-device-floppy"></i>프로젝트</button>
  <button id="load"><i class="ic ic-folder-open"></i>음원</button>
</header>

<section class="tab show" id="tab-edit">
  <div class="tools">
    <button id="undo" aria-label="되돌리기" disabled><i class="ic ic-arrow-back-up"></i></button>
    <button id="redo" aria-label="다시 하기" disabled><i class="ic ic-arrow-forward-up"></i></button>
    <button id="addTrack"><i class="ic ic-plus"></i>빈 트랙</button>
    <div class="sp"></div>
    <button id="zout" aria-label="축소"><i class="ic ic-zoom-out"></i></button>
    <button id="zin" aria-label="확대"><i class="ic ic-zoom-in"></i></button>
  </div>
  <div id="relinkBar" hidden><span id="relinkText"></span><button id="relinkBtn"><i class="ic ic-link"></i>음원 연결</button></div>
  <div id="view">
    <div id="content">
      <div id="rulerBox" class="stick"><canvas id="ruler"></canvas></div>
      <div id="tracks"><div class="empty stick">MP3, WAV 또는 압축 파일(zip)을 불러오세요</div></div>
    </div>
  </div>
  <div id="panel" hidden>
    <div class="ph"><b id="pTitle"></b><button id="pFold" aria-label="접기"><i class="ic ic-chevron-down"></i></button></div>
    <div class="body">
      <div class="acts">
        <button id="aCut"><i class="ic ic-scissors"></i>자르기</button>
        <button id="aCutX"><i class="ic ic-cut"></i>잘라내기</button>
        <button id="aCopy"><i class="ic ic-copy"></i>복사</button>
        <button id="aPaste"><i class="ic ic-clipboard"></i>붙여넣기</button>
        <button id="aDel"><i class="ic ic-trash"></i>삭제</button>
        <button id="aFade"><i class="ic ic-ease-in-out"></i>페이드</button>
        <button id="aMove"><i class="ic ic-arrows-move-horizontal"></i>이동</button>
        <button id="aDelTrack"><i class="ic ic-x"></i>트랙 지우기</button>
      </div>
      <div id="fadeBox" hidden></div>
      <div class="row"><span class="grow">자동 크로스페이드</span><button class="sw" id="xfade" aria-label="자동 크로스페이드"></button></div>
      <div id="volBox"></div>
    </div>
  </div>
</section>

<section class="tab" id="tab-mix"><div class="tools mixtop" id="mixTop"></div><div id="mixBody"></div></section>
<section class="tab" id="tab-export"><div id="expBody"></div><div id="expFoot"></div></section>

<div id="transport">
  <div id="seekRow">
    <span id="tCur">0:00.0</span>
    <div id="seek" role="slider" aria-label="재생 위치"><div id="seekLine"><div id="seekFill"></div></div><div id="seekKnob"></div></div>
    <span id="tDur">0:00</span>
  </div>
  <div id="tRow">
    <button id="loop" aria-label="구간 반복"><i class="ic ic-repeat"></i></button>
    <button id="home" aria-label="처음으로"><i class="ic ic-player-skip-back"></i></button>
    <button id="play" aria-label="재생"><i class="ic ic-player-play"></i></button>
    <div id="compare"></div>
  </div>
</div>
<nav>
  <button data-tab="edit" class="on"><i class="ic ic-wave-sine"></i>편집</button>
  <button data-tab="mix"><i class="ic ic-adjustments-horizontal"></i>믹싱</button>
  <button data-tab="export"><i class="ic ic-file-export"></i>내보내기</button>
</nav>
<div id="sheet" hidden><div class="sheet-box"><div class="sheet-h"><b>프로젝트</b><button id="sheetClose" aria-label="닫기"><i class="ic ic-x"></i></button></div><div id="sheetBody"></div></div></div>
<input id="file" type="file" multiple hidden>
<input id="relinkFile" type="file" multiple hidden>
<input id="projFile" type="file" hidden>
<input id="artFile" type="file" accept="image/*" hidden>
<input id="srtFile" type="file" hidden>
<script type="module" src="js/app.js"></script>
</body>
</html>
