<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0f1115" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml" />
  <title>My Vocal Studio</title>
  <style>
    :root { --bg:#0f1115; --card:#181c24; --line:#272d3a; --text:#f3f5f8; --sub:#9aa4b2; --accent:#5b8cff; --danger:#e05666; }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; padding-bottom:48px; }
    .wrap { max-width:500px; margin:0 auto; padding:16px; }
    header { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
    h1 { font-size:18px; margin:0; letter-spacing:-0.3px; }
    .mini-btn { background:var(--card); border:1px solid var(--line); color:var(--sub); border-radius:8px; padding:6px 10px; font-size:12px; cursor:pointer; }
    .tabs { display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; margin-bottom:14px; }
    .tab { padding:10px 6px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--sub); font-weight:600; font-size:13px; cursor:pointer; }
    .tab.active { background:var(--accent); border-color:var(--accent); color:#fff; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px; }
    label { display:block; font-size:13px; color:var(--sub); margin-bottom:6px; }
    input[type="text"], input[type="file"], select { width:100%; padding:10px; border-radius:10px; border:1px solid var(--line); background:#11141b; color:var(--text); font-size:14px; }
    .chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:6px; }
    .chip { padding:8px 12px; border-radius:999px; border:1px solid var(--line); background:#11141b; color:var(--text); font-size:13px; cursor:pointer; }
    .chip.active { background:var(--accent); border-color:var(--accent); font-weight:600; }
    .row { display:flex; justify-content:space-between; align-items:center; margin:10px 0 4px; font-size:13px; }
    input[type="range"] { width:100%; accent-color:var(--accent); }
    .check { display:flex; align-items:center; gap:8px; margin-top:10px; font-size:13px; color:var(--text); }
    .btn { width:100%; padding:13px; border:none; border-radius:12px; background:var(--accent); color:#fff; font-size:15px; font-weight:700; cursor:pointer; }
    .btn:disabled { opacity:0.45; }
    .btn-sub { background:#232936; color:var(--text); margin-top:8px; display:block; text-align:center; text-decoration:none; }
    .progress-wrap { height:6px; background:#232936; border-radius:999px; overflow:hidden; margin-bottom:8px; }
    .progress-bar { height:100%; width:0%; background:var(--accent); transition:width 0.3s; }
    .status { font-size:13px; color:var(--sub); min-height:18px; }
    audio { width:100%; margin-top:8px; }
    .ab-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; margin-top:8px; }
    .ab-grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:8px; }
    .ab-btn { padding:9px 4px; border-radius:10px; border:1px solid var(--line); background:#11141b; color:var(--text); font-size:12px; font-weight:600; cursor:pointer; }
    .ab-btn.active { border-color:var(--accent); color:var(--accent); }
    .model-item { display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--line); font-size:13px; }
    .model-item:last-child { border-bottom:none; }
    .del-btn { background:transparent; border:1px solid var(--danger); color:var(--danger); border-radius:8px; padding:4px 10px; font-size:12px; cursor:pointer; }
    .hidden { display:none; }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>My Vocal Studio</h1>
    <button class="mini-btn" onclick="changePin()">PIN 설정</button>
  </header>

  <div class="card">
    <div class="progress-wrap"><div id="pbar" class="progress-bar"></div></div>
    <div id="status" class="status">Suno 보컬 WAV를 선택해 보정·변환·학습을 시작하세요.</div>
  </div>

  <div class="tabs">
    <button id="t-conv" class="tab active" onclick="switchTab('conv')">보정 · 변환</button>
    <button id="t-rest" class="tab" onclick="switchTab('rest')">보정 단독</button>
    <button id="t-train" class="tab" onclick="switchTab('train')">학습 · 모델</button>
  </div>

  <section id="sec-conv">
    <div class="card">
      <label>1. Suno 보컬 WAV 선택</label>
      <input id="convFile" type="file" accept=".wav,audio/wav" />
    </div>

    <div class="card">
      <div class="row" style="margin-top:0;">
        <span>2. 목소리 모델 선택</span>
        <button class="mini-btn" onclick="loadModels()">새로고침</button>
      </div>
      <div id="modelChips" class="chips"><span style="color:var(--sub);font-size:12px;">불러오는 중...</span></div>
    </div>

    <div class="card">
      <div class="row"><span>키 조절 (반음)</span><strong id="vPitch">0</strong></div>
      <input id="pitch" type="range" min="-12" max="12" step="1" value="0" oninput="vPitch.textContent=this.value" />

      <div class="row"><span>Suno 쉬머·아티팩트 제거</span><strong id="vShimmer">55%</strong></div>
      <input id="shimmer" type="range" min="0" max="1" step="0.05" value="0.55" oninput="vShimmer.textContent=Math.round(this.value*100)+'%'" />

      <div class="row"><span>음색 반영 강도 (Index)</span><strong id="vIndex">65%</strong></div>
      <input id="indexRate" type="range" min="0" max="1" step="0.05" value="0.65" oninput="vIndex.textContent=Math.round(this.value*100)+'%'" />

      <div class="row"><span>자음·숨소리 보호 (Protect)</span><strong id="vProtect">0.38</strong></div>
      <input id="protect" type="range" min="0" max="0.5" step="0.02" value="0.38" oninput="vProtect.textContent=this.value" />

      <label class="check"><input id="harmony" type="checkbox" checked /> 화음·백킹 보컬 제거 (리드 단일화)</label>
      <label class="check"><input id="apollo" type="checkbox" checked /> 후처리 Apollo 보컬 고역 복원</label>
    </div>

    <button id="btnConv" class="btn" onclick="runConvert()">정제 및 목소리 변환 시작</button>

    <div id="convResultBox" class="card hidden" style="margin-top:12px;">
      <label>실시간 A/B 비교 (같은 소절 위치 유지)</label>
      <div class="ab-grid">
        <button id="ab-orig" class="ab-btn" onclick="playConvTrack('orig')">원본</button>
        <button id="ab-clean" class="ab-btn" onclick="playConvTrack('clean')">정제본</button>
        <button id="ab-final" class="ab-btn active" onclick="playConvTrack('final')">최종 변환</button>
      </div>
      <audio id="convPlayer" controls></audio>
      <a id="dlConvFinal" class="btn btn-sub" download="converted_vocal.wav">24-bit 최종 변환 WAV 저장</a>
      <a id="dlConvClean" class="btn btn-sub" download="cleaned_vocal.wav">24-bit 정제본(변환 전) 저장</a>
    </div>
  </section>

  <section id="sec-rest" class="hidden">
    <div class="card">
      <label>Suno 보컬 WAV 선택 (아티팩트·클리핑만 정제)</label>
      <input id="restFile" type="file" accept=".wav,audio/wav" />

      <div class="row"><span>Suno 쉬머·공진 억제 강도</span><strong id="vRShimmer">55%</strong></div>
      <input id="rShimmer" type="range" min="0" max="1" step="0.05" value="0.55" oninput="vRShimmer.textContent=Math.round(this.value*100)+'%'" />

      <div class="row"><span>치찰음(De-esser) 억제 비율</span><strong id="vRDeess">3.0:1</strong></div>
      <input id="rDeess" type="range" min="1.0" max="6.0" step="0.5" value="3.0" oninput="vRDeess.textContent=Number(this.value).toFixed(1)+':1'" />

      <div class="row"><span>목표 라우드니스 (LUFS)</span><strong id="vRLufs">-15 LUFS</strong></div>
      <input id="rLufs" type="range" min="-20" max="-11" step="1" value="-15" oninput="vRLufs.textContent=this.value+' LUFS'" />

      <label class="check"><input id="rHarmony" type="checkbox" checked /> 화음·백킹 보컬 제거</label>
      <label class="check"><input id="rReverb" type="checkbox" checked /> 잔향(Reverb) 제거 → Dry 보컬화</label>
      <label class="check"><input id="rApollo" type="checkbox" checked /> Apollo 보컬 고역 복원</label>
    </div>

    <button id="btnRest" class="btn" onclick="runRestore()">보컬 보정·복원 실행</button>

    <div id="restResultBox" class="card hidden" style="margin-top:12px;">
      <label>원본 vs 보정본 비교</label>
      <div class="ab-grid-2">
        <button id="rab-orig" class="ab-btn" onclick="playRestTrack('orig')">원본</button>
        <button id="rab-final" class="ab-btn active" onclick="playRestTrack('final')">보정 완료본</button>
      </div>
      <audio id="restPlayer" controls></audio>
      <a id="dlRestFinal" class="btn btn-sub" download="restored_vocal.wav">24-bit 보정 WAV 저장</a>
    </div>
  </section>

  <section id="sec-train" class="hidden">
    <div class="card">
      <label style="color:var(--text);font-weight:700;">A. 새 목소리 모델 학습</label>
      <label>모델 이름 (영문/숫자/한글)</label>
      <input id="trainName" type="text" placeholder="예: my_voice_v1" />
      <label style="margin-top:10px;">학습용 보컬 WAV들 (총 10~30분 권장)</label>
      <input id="trainFiles" type="file" accept=".wav,audio/wav" multiple />
      <div class="row"><span>학습 에포크</span><strong id="vEpoch">250</strong></div>
      <input id="epochs" type="range" min="100" max="500" step="25" value="250" oninput="vEpoch.textContent=this.value" />
      <label class="check"><input id="preDereverb" type="checkbox" checked /> 학습 전 자동 잔향·클리핑 정제</label>
      <button id="btnTrain" class="btn" style="margin-top:12px;" onclick="runTrain()">보이스 모델 학습 시작</button>
    </div>

    <div class="card">
      <label style="color:var(--text);font-weight:700;">B. 이미 있는 모델(.pth/.index) 바로 등록</label>
      <label>등록할 모델 이름</label>
      <input id="upName" type="text" placeholder="예: singer_custom" />
      <label style="margin-top:8px;">.pth 가중치 파일 (필수)</label>
      <input id="upPth" type="file" accept=".pth" />
      <label style="margin-top:8px;">.index 파일 (선택)</label>
      <input id="upIdx" type="file" accept=".index" />
      <button id="btnUploadModel" class="btn btn-sub" style="margin-top:12px;" onclick="uploadModel()">모델 바로 추가</button>
    </div>

    <div class="card">
      <div class="row" style="margin-top:0;">
        <strong style="font-size:13px;">C. 등록된 모델 관리</strong>
        <button class="mini-btn" onclick="loadModels()">새로고침</button>
      </div>
      <div id="modelListAdmin" style="margin-top:6px;"></div>
    </div>
  </section>
</div>

<script>
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});

  let selectedModel = null;
  let convUrls = { orig: null, clean: null, final: null };
  let restUrls = { orig: null, final: null };

  function getPin() {
    let pin = localStorage.getItem("my_vocal_pin");
    if (!pin) {
      pin = prompt("개인 접속 PIN 번호를 입력하세요:", "123456") || "";
      localStorage.setItem("my_vocal_pin", pin);
    }
    return pin;
  }

  function changePin() {
    const pin = prompt("새 PIN 번호 입력:", localStorage.getItem("my_vocal_pin") || "");
    if (pin !== null) { localStorage.setItem("my_vocal_pin", pin); loadModels(); }
  }

  function setStatus(pct, msg) {
    document.getElementById("pbar").style.width = pct + "%";
    document.getElementById("status").textContent = msg;
  }

  function switchTab(tab) {
    ["conv", "rest", "train"].forEach(k => {
      document.getElementById("sec-" + k).classList.toggle("hidden", k !== tab);
      document.getElementById("t-" + k).classList.toggle("active", k === tab);
    });
  }

  async function apiFetch(url, options = {}) {
    options.headers = { ...(options.headers || {}), "X-App-Pin": getPin() };
    const res = await fetch(url, options);
    if (res.status === 401) {
      localStorage.removeItem("my_vocal_pin");
      throw new Error("PIN 번호가 틀렸습니다. 우측 상단에서 다시 설정하세요.");
    }
    if (!res.ok) {
      const txt = await res.text();
      throw new Error(txt || `HTTP ${res.status}`);
    }
    return res;
  }

  async function loadModels() {
    const box = document.getElementById("modelChips");
    const admin = document.getElementById("modelListAdmin");
    try {
      const res = await apiFetch("/api/models");
      const data = await res.json();
      const models = data.models || [];
      if (!models.length) {
        box.innerHTML = '<span style="color:var(--sub);font-size:12px;">등록된 모델이 없습니다. [학습 · 모델] 탭에서 추가하세요.</span>';
        admin.innerHTML = '<span style="color:var(--sub);font-size:12px;">등록된 모델 없음</span>';
        selectedModel = null;
        return;
      }
      const names = models.map(m => m.name);
      if (!selectedModel || !names.includes(selectedModel)) selectedModel = names[0];

      box.innerHTML = "";
      models.forEach(m => {
        const el = document.createElement("button");
        el.className = "chip" + (m.name === selectedModel ? " active" : "");
        el.textContent = m.name;
        el.onclick = () => { selectedModel = m.name; loadModels(); };
        box.appendChild(el);
      });

      admin.innerHTML = "";
      models.forEach(m => {
        const row = document.createElement("div");
        row.className = "model-item";
        row.innerHTML = `<div><strong>${m.name}</strong><div style="color:var(--sub);font-size:11px;">${m.sample_rate/1000}kHz · ${m.embedder_model} · ${m.has_index ? "Index 있음" : "Index 없음"}</div></div>`;
        const del = document.createElement("button");
        del.className = "del-btn";
        del.textContent = "삭제";
        del.onclick = async () => {
          if (!confirm(`[${m.name}] 모델을 삭제할까요?`)) return;
          await apiFetch(`/api/models/${encodeURIComponent(m.name)}`, { method: "DELETE" });
          loadModels();
        };
        row.appendChild(del);
        admin.appendChild(row);
      });
    } catch (e) { setStatus(0, e.message); }
  }

  async function fetchBlobUrl(url) {
    const res = await apiFetch(url);
    return URL.createObjectURL(await res.blob());
  }

  function playSynced(playerId, url, btnPrefix, activeKey, keys) {
    if (!url) return;
    keys.forEach(k => document.getElementById(btnPrefix + k).classList.toggle("active", k === activeKey));
    const p = document.getElementById(playerId);
    const t = p.currentTime || 0;
    const playing = !p.paused;
    p.src = url;
    p.onloadedmetadata = () => {
      if (t < p.duration) p.currentTime = t;
      if (playing) p.play();
    };
  }

  function playConvTrack(k) { playSynced("convPlayer", convUrls[k], "ab-", k, ["orig", "clean", "final"]); }
  function playRestTrack(k) { playSynced("restPlayer", restUrls[k], "rab-", k, ["orig", "final"]); }

  async function pollJob(jobId, intervalMs, onDone) {
    while (true) {
      const res = await apiFetch(`/api/jobs/${jobId}`);
      const st = await res.json();
      setStatus(st.progress || 0, st.message || "");
      if (st.status === "done") { await onDone(); break; }
      if (st.status === "failed") break;
      await new Promise(r => setTimeout(r, intervalMs));
    }
  }

  async function runConvert() {
    const f = document.getElementById("convFile").files[0];
    if (!f) return alert("Suno 보컬 WAV 파일을 선택해 주세요.");
    if (!selectedModel) return alert("목소리 모델을 선택해 주세요.");
    const btn = document.getElementById("btnConv");
    btn.disabled = true;
    setStatus(3, "WAV 업로드 중...");
    convUrls.orig = URL.createObjectURL(f);

    try {
      const fd = new FormData();
      fd.append("file", f);
      fd.append("model_name", selectedModel);
      fd.append("pitch_shift", document.getElementById("pitch").value);
      fd.append("shimmer_strength", document.getElementById("shimmer").value);
      fd.append("index_rate", document.getElementById("indexRate").value);
      fd.append("protect", document.getElementById("protect").value);
      fd.append("remove_harmony", document.getElementById("harmony").checked);
      fd.append("use_apollo", document.getElementById("apollo").checked);

      const { job_id } = await (await apiFetch("/api/convert", { method: "POST", body: fd })).json();
      await pollJob(job_id, 3000, async () => {
        convUrls.clean = await fetchBlobUrl(`/api/jobs/${job_id}/audio/cleaned`);
        convUrls.final = await fetchBlobUrl(`/api/jobs/${job_id}/audio/final`);
        document.getElementById("dlConvClean").href = convUrls.clean;
        document.getElementById("dlConvClean").download = `cleaned_${job_id}.wav`;
        document.getElementById("dlConvFinal").href = convUrls.final;
        document.getElementById("dlConvFinal").download = `${selectedModel}_${job_id}.wav`;
        document.getElementById("convResultBox").classList.remove("hidden");
        playConvTrack("final");
      });
    } catch (e) { setStatus(0, "오류: " + e.message); }
    finally { btn.disabled = false; }
  }

  async function runRestore() {
    const f = document.getElementById("restFile").files[0];
    if (!f) return alert("보정할 WAV 파일을 선택해 주세요.");
    const btn = document.getElementById("btnRest");
    btn.disabled = true;
    setStatus(3, "WAV 업로드 중...");
    restUrls.orig = URL.createObjectURL(f);

    try {
      const fd = new FormData();
      fd.append("file", f);
      fd.append("shimmer_strength", document.getElementById("rShimmer").value);
      fd.append("deess_ratio", document.getElementById("rDeess").value);
      fd.append("target_lufs", document.getElementById("rLufs").value);
      fd.append("remove_harmony", document.getElementById("rHarmony").checked);
      fd.append("remove_reverb", document.getElementById("rReverb").checked);
      fd.append("use_apollo", document.getElementById("rApollo").checked);

      const { job_id } = await (await apiFetch("/api/restore", { method: "POST", body: fd })).json();
      await pollJob(job_id, 3000, async () => {
        restUrls.final = await fetchBlobUrl(`/api/jobs/${job_id}/audio/final`);
        document.getElementById("dlRestFinal").href = restUrls.final;
        document.getElementById("dlRestFinal").download = `restored_${job_id}.wav`;
        document.getElementById("restResultBox").classList.remove("hidden");
        playRestTrack("final");
      });
    } catch (e) { setStatus(0, "오류: " + e.message); }
    finally { btn.disabled = false; }
  }

  async function runTrain() {
    const name = document.getElementById("trainName").value.trim();
    const files = document.getElementById("trainFiles").files;
    if (!name || !files.length) return alert("모델 이름과 학습용 WAV 파일을 입력해 주세요.");
    const btn = document.getElementById("btnTrain");
    btn.disabled = true;
    setStatus(3, "학습 데이터 업로드 중...");

    try {
      const fd = new FormData();
      fd.append("model_name", name);
      fd.append("epochs", document.getElementById("epochs").value);
      fd.append("pre_dereverb", document.getElementById("preDereverb").checked);
      for (const f of files) fd.append("files", f);

      const { job_id } = await (await apiFetch("/api/train", { method: "POST", body: fd })).json();
      await pollJob(job_id, 8000, async () => { await loadModels(); });
    } catch (e) { setStatus(0, "오류: " + e.message); }
    finally { btn.disabled = false; }
  }

  async function uploadModel() {
    const name = document.getElementById("upName").value.trim();
    const pth = document.getElementById("upPth").files[0];
    const idx = document.getElementById("upIdx").files[0];
    if (!name || !pth) return alert("모델 이름과 .pth 파일을 선택해 주세요.");
    const btn = document.getElementById("btnUploadModel");
    btn.disabled = true;
    setStatus(20, "기존 모델 업로드 중...");

    try {
      const fd = new FormData();
      fd.append("model_name", name);
      fd.append("pth_file", pth);
      if (idx) fd.append("index_file", idx);
      await apiFetch("/api/models/upload", { method: "POST", body: fd });
      setStatus(100, `[${name}] 모델 등록 완료!`);
      document.getElementById("upName").value = "";
      document.getElementById("upPth").value = "";
      document.getElementById("upIdx").value = "";
      await loadModels();
    } catch (e) { setStatus(0, "업로드 오류: " + e.message); }
    finally { btn.disabled = false; }
  }

  loadModels();
</script>
</body>
</html>
